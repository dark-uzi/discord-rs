[package]
name = "discord-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.36"
egui_extras = { version = "0.36", features = ["http", "image", "gif"] }
reqwest = { version = "0.13", features = ["json", "query", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
chrono = "0.4"
anyhow = "1"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4"

[profile.dev]
opt-level = 1
